name: validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: validate-${{ forgejo.ref }}
  cancel-in-progress: true
jobs:
  validate:
    # Linux homelab runner: npm and Go checks only. Swift build and tests run in
    # local `task check` and `task release:check` (see AGENTS.md).
    runs-on: homelab
    permissions:
      contents: read
    env:
      SKIP_SWIFT: "1"
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - uses: https://data.forgejo.org/actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          echo "$(go env GOPATH)/bin" >> "$FORGEJO_PATH"
      - run: npm ci
      - run: task lint
      - run: task build
      - run: task test
