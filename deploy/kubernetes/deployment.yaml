apiVersion: apps/v1
kind: Deployment
metadata:
  name: scratchpad
  labels:
    app.kubernetes.io/name: scratchpad
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scratchpad
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scratchpad
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: scratchpad
          image: ghcr.io/alexcatdad/scratchpad@sha256:replace-with-published-digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: scratchpad-config
            - secretRef:
                name: scratchpad-runtime
          env:
            - name: SCRATCHPAD_DATABASE_PATH
              value: /data/scratchpad.sqlite
            - name: SCRATCHPAD_ENCRYPTION_KEY_FILE
              value: /run/secrets/scratchpad/installation-key
          volumeMounts:
            - name: data
              mountPath: /data
            - name: encryption-key
              mountPath: /run/secrets/scratchpad
              readOnly: true
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scratchpad-data
        - name: encryption-key
          secret:
            secretName: scratchpad-encryption-key
            defaultMode: 288
