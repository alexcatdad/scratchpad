services:
  scratchpad:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      SCRATCHPAD_PUBLIC_URL: ${SCRATCHPAD_PUBLIC_URL:-http://localhost:3000}
      SCRATCHPAD_DATABASE_PATH: /data/scratchpad.sqlite
      SCRATCHPAD_TRUSTED_PROXIES: ${SCRATCHPAD_TRUSTED_PROXIES:-}
      SCRATCHPAD_GITHUB_CLIENT_ID: ${SCRATCHPAD_GITHUB_CLIENT_ID:-}
      SCRATCHPAD_GITHUB_CLIENT_SECRET: ${SCRATCHPAD_GITHUB_CLIENT_SECRET:-}
    volumes:
      - scratchpad-data:/data
    restart: unless-stopped
volumes:
  scratchpad-data:
