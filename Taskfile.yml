version: "3"

# Release tasks. Releases run only from an explicit local invocation:
#   task release:check | release:prepare | release | release:resume
# See docs/runbooks/release.md. CI never releases, signs, deploys or updates
# the tap.

vars:
  RELTOOL_TAG: v0.4.1
  RELTOOL_COMMIT: e5dbed8034b899e5a7091ef1d3edf8e8da7989ab # commit of RELTOOL_TAG
  # release-tools checkout used to build the pinned reltool. Override with the
  # RELTOOL_SRC environment variable or `task release:check RELTOOL_SRC=...`.
  RELTOOL_SRC: '{{.RELTOOL_SRC | default "../../../infrastructure/release-tools"}}'
  GOVULNCHECK_VERSION: v1.9.0
  MCP_COVERAGE_FLOOR: 64
  BACKEND_COVERAGE_FLOOR: 68
  SWIFT_COVERAGE_FLOOR: 66
  RELTOOL:
    sh: echo "${XDG_CACHE_HOME:-$HOME/.cache}/release-tools/{{.RELTOOL_COMMIT}}/reltool"

tasks:
  # --- app-owned recipes ---
  check:
    desc: Full local gate (lint, type-check, build and tests for npm, Go and Swift)
    cmds:
      - task: lint
      - task: build
      - task: test

  # Release-tools runs `check` in a clean checkout, so the npm tasks install
  # the locked dependencies first. Skipped when node_modules matches the lock.
  npm:install:
    internal: true
    status:
      - test -x node_modules/.bin/biome
      - test node_modules/.package-lock.json -nt package-lock.json
    cmds:
      - npm ci --no-audit --no-fund

  # golangci-lint is pinned in tools/lint/go.mod and built into .tools/.
  golangci-lint:install:
    internal: true
    sources:
      - tools/lint/go.mod
      - tools/lint/go.sum
    generates:
      - .tools/golangci-lint
    cmds:
      - go -C tools/lint build -o ../../.tools/golangci-lint github.com/golangci/golangci-lint/v2/cmd/golangci-lint

  lint:
    desc: Format, lint and type checks (npm, gofmt, go vet, golangci-lint, swift-format; SKIP_SWIFT=1 skips Swift)
    deps: [npm:install, golangci-lint:install]
    cmds:
      - npm run lint
      - npm run typecheck
      - for: [backend, mcp, packages/clients/go]
        cmd: test -z "$(gofmt -l {{.ITEM}})"
      - for: [backend, mcp, packages/clients/go]
        cmd: go -C {{.ITEM}} vet ./...
      - for: [backend, mcp, packages/clients/go]
        cmd: cd {{.ITEM}} && "{{.ROOT_DIR}}/.tools/golangci-lint" run --config "{{.ROOT_DIR}}/.golangci.yml" ./...
      - cmd: DEVELOPER_DIR="$(xcode-select -p)" swift format lint --strict --recursive macos/Package.swift macos/Sources macos/Tests
        if: '[ -z "$SKIP_SWIFT" ]'

  build:
    desc: Build the web workspaces, Go binaries and the Swift package (SKIP_SWIFT=1 skips Swift)
    deps: [npm:install]
    cmds:
      - npm run build
      - go -C backend build ./...
      - go -C mcp build ./...
      - cmd: DEVELOPER_DIR="$(xcode-select -p)" swift build --package-path macos --build-tests -Xswiftc -warnings-as-errors
        if: '[ -z "$SKIP_SWIFT" ]'

  # Coverage floors: measured value rounded down, minus 2 (never below 60%).
  # The web workspace (1.3%) and packages/clients/go (2.4%, mostly generated
  # code) are under 60% and have no floor yet.
  test:
    desc: npm, Go race and Swift tests with coverage floors (SKIP_SWIFT=1 skips Swift)
    deps: [npm:install]
    cmds:
      - npm test
      - sh scripts/coverage-go.sh mcp {{.MCP_COVERAGE_FLOOR}} ./internal/...,./cmd/...
      - sh scripts/coverage-backend.sh {{.BACKEND_COVERAGE_FLOOR}} -timeout 30m
      - go -C packages/clients/go test -race -count=1 ./...
      - cmd: DEVELOPER_DIR="$(xcode-select -p)" sh scripts/coverage-swift.sh {{.SWIFT_COVERAGE_FLOOR}}
        if: '[ -z "$SKIP_SWIFT" ]'

  security:
    desc: Known-vulnerability scan for Go modules and production npm dependencies
    cmds:
      - for: [backend, mcp, packages/clients/go]
        cmd: cd {{.ITEM}} && go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...
      - npm audit --omit=dev --audit-level=high

  build:darwin-arm64:
    desc: Signed Scratchpad.app archive for the Homebrew cask
    cmds:
      - sh scripts/release-app-build.sh

  validate:darwin-arm64:
    cmds:
      - bash scripts/release-validate.sh

  # --- release-tools consumer snippet ---
  reltool:install:
    internal: true
    status:
      - test -x "{{.RELTOOL}}"
    cmds:
      - |
        git -C "{{.RELTOOL_SRC}}" rev-parse --git-dir >/dev/null 2>&1 || {
          echo "release-tools checkout not found at {{.RELTOOL_SRC}} (relative to {{.ROOT_DIR}})." >&2
          echo "Clone it there or set RELTOOL_SRC to its path." >&2
          exit 1
        }
      - git -C "{{.RELTOOL_SRC}}" show "{{.RELTOOL_COMMIT}}:scripts/install-reltool.sh" | sh -s -- "{{.RELTOOL_SRC}}" "{{.RELTOOL_TAG}}" "{{.RELTOOL_COMMIT}}"

  release:check:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release check --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:prepare:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release prepare --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release run --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:resume:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release resume --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:abandon:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release abandon {{.CLI_ARGS}}'
