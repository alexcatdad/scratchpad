version: "3"

# Release tasks. Releases run only from an explicit local invocation:
#   task release:check | release:prepare | release | release:resume
# See docs/runbooks/release.md. CI never releases, signs, deploys or updates
# the tap.

vars:
  RELTOOL_TAG: v0.2.0
  RELTOOL_COMMIT: 6036a85828711fbfb908f67e159482597c4434c0 # commit of RELTOOL_TAG
  RELTOOL_SRC: ../release-tools
  RELTOOL:
    sh: echo "${XDG_CACHE_HOME:-$HOME/.cache}/release-tools/{{.RELTOOL_COMMIT}}/reltool"

tasks:
  # --- app-owned recipes ---
  check:
    desc: Go checks for the released scratchpad-mcp binary
    dir: mcp
    cmds:
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test -race -count=1 ./...

  build:darwin-arm64:
    cmds:
      - RELEASE_OS=darwin RELEASE_ARCH=arm64 bash scripts/release-build.sh

  build:darwin-amd64:
    cmds:
      - RELEASE_OS=darwin RELEASE_ARCH=amd64 bash scripts/release-build.sh

  build:linux-arm64:
    cmds:
      - RELEASE_OS=linux RELEASE_ARCH=arm64 bash scripts/release-build.sh

  build:linux-amd64:
    cmds:
      - RELEASE_OS=linux RELEASE_ARCH=amd64 bash scripts/release-build.sh

  validate:darwin-arm64:
    cmds:
      - bash scripts/release-validate.sh

  deploy:image:
    desc: Build and push the application image (run through `task deploy`)
    cmds:
      - bash scripts/deploy-image.sh

  # --- release-tools consumer snippet ---
  reltool:install:
    internal: true
    status:
      - test -x "{{.RELTOOL}}"
    cmds:
      - git -C "{{.RELTOOL_SRC}}" show "{{.RELTOOL_COMMIT}}:scripts/install-reltool.sh" | sh -s -- "{{.RELTOOL_SRC}}" "{{.RELTOOL_TAG}}" "{{.RELTOOL_COMMIT}}"

  release:check:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release check --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:prepare:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release prepare --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release run --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:resume:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release resume --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:abandon:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release abandon {{.CLI_ARGS}}'

  deploy:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" deploy {{.CLI_ARGS}} --task-exe "{{.TASK_EXE}}"'
