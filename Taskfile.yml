version: "3"

# Release tasks. Releases run only from an explicit local invocation:
#   task release:check | release:prepare | release | release:resume
# See docs/runbooks/release.md. CI never releases, signs, deploys or updates
# the tap.

vars:
  RELTOOL_TAG: v0.4.0
  RELTOOL_COMMIT: ff2121719c23b0149c16d5a0b2f5e580257947c5 # commit of RELTOOL_TAG
  RELTOOL_SRC: ../release-tools
  GOVULNCHECK_VERSION: v1.9.0
  RELTOOL:
    sh: echo "${XDG_CACHE_HOME:-$HOME/.cache}/release-tools/{{.RELTOOL_COMMIT}}/reltool"

tasks:
  # --- app-owned recipes ---
  check:
    desc: Full local gate (lint, type-check, build and tests for npm, Go and Swift)
    cmds:
      - task: lint
      - task: build
      - task: test

  # Release-tools runs `check` in a clean checkout, so the npm tasks install
  # the locked dependencies first. Skipped when node_modules matches the lock.
  npm:install:
    internal: true
    status:
      - test -x node_modules/.bin/biome
      - test node_modules/.package-lock.json -nt package-lock.json
    cmds:
      - npm ci --no-audit --no-fund

  lint:
    desc: Format, lint and type checks
    deps: [npm:install]
    cmds:
      - npm run lint
      - npm run typecheck
      - for: [backend, mcp, packages/clients/go]
        cmd: test -z "$(gofmt -l {{.ITEM}})"
      - for: [backend, mcp, packages/clients/go]
        cmd: go -C {{.ITEM}} vet ./...

  build:
    desc: Build the web workspaces, Go binaries and the Swift package (SKIP_SWIFT=1 skips Swift)
    deps: [npm:install]
    cmds:
      - npm run build
      - go -C backend build ./...
      - go -C mcp build ./...
      - cmd: DEVELOPER_DIR="$(xcode-select -p)" swift build --package-path macos
        if: '[ -z "$SKIP_SWIFT" ]'

  test:
    desc: npm, Go race and Swift tests (SKIP_SWIFT=1 skips Swift)
    deps: [npm:install]
    cmds:
      - npm test
      - go -C mcp test -race -count=1 ./...
      - go -C backend test -race -count=1 -timeout 20m ./...
      - cmd: DEVELOPER_DIR="$(xcode-select -p)" swift test --package-path macos
        if: '[ -z "$SKIP_SWIFT" ]'

  security:
    desc: Known-vulnerability scan for Go modules and production npm dependencies
    cmds:
      - for: [backend, mcp, packages/clients/go]
        cmd: cd {{.ITEM}} && go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...
      - npm audit --omit=dev --audit-level=high

  build:darwin-arm64:
    desc: Signed Scratchpad.app archive for the Homebrew cask
    cmds:
      - sh scripts/release-app-build.sh

  validate:darwin-arm64:
    cmds:
      - bash scripts/release-validate.sh

  # --- release-tools consumer snippet ---
  reltool:install:
    internal: true
    status:
      - test -x "{{.RELTOOL}}"
    cmds:
      - git -C "{{.RELTOOL_SRC}}" show "{{.RELTOOL_COMMIT}}:scripts/install-reltool.sh" | sh -s -- "{{.RELTOOL_SRC}}" "{{.RELTOOL_TAG}}" "{{.RELTOOL_COMMIT}}"

  release:check:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release check --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:prepare:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release prepare --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release run --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:resume:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release resume --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:abandon:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release abandon {{.CLI_ARGS}}'
