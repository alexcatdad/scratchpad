name: Publish macOS app
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag with locally signed app assets in a draft release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: scratchpad-macos-app-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: action-runners
    timeout-minutes: 20
    permissions:
      contents: write # Read draft assets and publish the verified app release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release source and draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ -n "$APPLE_TEAM_ID" ]]
          git fetch origin main "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" \
            --limit 1 --json status,conclusion | jq -e 'length == 1 and .[0].status == "completed" and .[0].conclusion == "success"'
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease | jq -e '.isDraft and (.isPrerelease | not)'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check scoped tap permissions before publication
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          owner: alexcatdad
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - name: Download and independently verify app assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASSET_DIR: ${{ runner.temp }}/app-assets
        run: |
          set -euo pipefail
          mkdir -p "$ASSET_DIR"
          gh release download "$RELEASE_TAG" --dir "$ASSET_DIR" \
            --pattern "scratchpad-$RELEASE_TAG-darwin-arm64.zip" \
            --pattern "notarization-app-$RELEASE_TAG.json" --pattern macos-app-release.json
          bash scripts/verify-macos-app-release.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alexcatdad/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: tap
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Generate and validate only the app cask
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_DEVELOPER: "1"
        run: |
          set -euo pipefail
          node scripts/release-cask.mjs "$RELEASE_TAG" \
            "$RUNNER_TEMP/app-assets/scratchpad-$RELEASE_TAG-darwin-arm64.zip" tap
          ruby -c tap/Casks/scratchpad.rb
          # Third-party hooks hold the upgrade lock until the brew process exits.
          brew style --except-cops=Cask/InstallSteps,Style/AutoResourceCleanup,Style/FileOpen tap/Casks/scratchpad.rb
          brew tap alexcatdad/tap "$PWD/tap"
          brew trust --cask alexcatdad/tap/scratchpad
          brew info --cask alexcatdad/tap/scratchpad
      - name: Publish verified app and propose tap update
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$RELEASE_TAG"
          [[ $(git rev-parse 'FETCH_HEAD^{commit}') == "$EXPECTED_SHA" ]]
          # Never replace the assets that were independently verified.
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
          export GH_TOKEN="$TAP_TOKEN"
          branch="automation/scratchpad-app-${RELEASE_TAG#v}"
          git -C tap checkout -b "$branch"
          git -C tap config user.name 'github-actions[bot]'
          git -C tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C tap add Casks/scratchpad.rb
          if git -C tap diff --cached --quiet; then exit 0; fi
          git -C tap commit -m "Release Scratchpad app ${RELEASE_TAG#v}"
          git -C tap push origin "$branch"
          # shellcheck disable=SC2016 # Markdown backticks are literal PR text.
          printf 'Installs the signed and notarized Scratchpad app from %s. The app archive, source manifest, signing team and Apple trust were verified before publication.\n\nInstall with `brew install --cask alexcatdad/tap/scratchpad`; this trusts only the cask.\n' "$RELEASE_TAG" > "$RUNNER_TEMP/tap-pr.md"
          gh pr create --repo alexcatdad/homebrew-tap --base main --head "$branch" \
            --title "Release Scratchpad app ${RELEASE_TAG#v}" --body-file "$RUNNER_TEMP/tap-pr.md"
