name: Verify release access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: action-runners
    steps:
      - name: Verify public release configuration
        env:
          APP_ID: ${{ vars.APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ -n "$APP_ID" && "$APP_ID" != 0 ]]
          [[ "$APPLE_TEAM_ID" == CX6D6KGCT5 ]]
      - name: Authenticate GitHub App with tap write permission
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          owner: alexcatdad
          repositories: homebrew-tap
          permission-contents: write
      - name: Verify repository access without changing the tap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          gh api repos/alexcatdad/homebrew-tap --jq .full_name | grep -Fx alexcatdad/homebrew-tap
          printf 'GitHub App authentication and requested tap contents-write permission verified.\n'
