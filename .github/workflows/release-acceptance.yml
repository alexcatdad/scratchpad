name: Verify published release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (vYYYY.M.N, or a historical vX.Y.Z) to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  homebrew:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Verify public release and install from Homebrew
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){2,3}$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease | jq -e '.isDraft == false and .isPrerelease == false'
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          brew install alexcatdad/tap/scratchpad-mcp
          brew test alexcatdad/tap/scratchpad-mcp
          binary="$(brew --prefix scratchpad-mcp)/bin/scratchpad-mcp"
          "$binary" --version | grep -Fx "scratchpad-mcp ${RELEASE_TAG#v}"
          echo "SCRATCHPAD_E2E_MCP_BINARY=$binary" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == macOS ]]; then
            spctl --assess --type execute "$binary" >/dev/null 2>&1 || true
            codesign --verify --strict --test-requirement '=notarized' "$binary"
            codesign -dv --verbose=4 "$binary" 2> signature.txt
            grep -Fx 'TeamIdentifier=CX6D6KGCT5' signature.txt
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @scratchpad/web
      - name: Verify installed binary authentication capture and restart
        run: npm run test:e2e
