name: Publish application image

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit SHA to build (must already be on main and have passing CI)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scratchpad-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'alexcatdad/scratchpad' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      image: ${{ steps.image.outputs.digest && format('ghcr.io/alexcatdad/scratchpad@{0}', steps.image.outputs.digest) }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Verify selected revision and canonical CI
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C source fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main "$REQUESTED_REVISION"
          revision=$(git -C source rev-parse "$REQUESTED_REVISION^{commit}")
          git -C source merge-base --is-ancestor "$revision" origin/main
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$revision" \
            --limit 1 --json status,conclusion | jq -e 'length == 1 and .[0].status == "completed" and .[0].conclusion == "success"' >/dev/null
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          file: Dockerfile
          target: go-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/alexcatdad/scratchpad:sha-${{ steps.source.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/alexcatdad/scratchpad
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          provenance: true
          sbom: true
      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf "Published \`%s@%s\` from \`%s\`.\\n" ghcr.io/alexcatdad/scratchpad "$IMAGE_DIGEST" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
