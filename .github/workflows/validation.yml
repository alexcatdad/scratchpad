# Validation through the shared contract (alexcatdad/ci-actions, pinned).
# After a push to main (or a manual run) passes the main jobs, the deploy job
# runs homelab-deploy-slot on this repo's own runner on the homelab: the host
# builds the tip of main from GitHub, switches the slot, checks health and
# rolls back on failure. The weekly schedule never deploys.
# The vulnix report (security) lists known CVEs in the built package without failing.
# govulncheck covers the Go modules with packages (tools/lint only pins tools).
name: Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: alexcatdad/ci-actions/.github/workflows/validate-pr.yml@2ff7a21eaa680d9eba4987e52697a6f2601054ea
    with:
      nix: true
      build-command: nix build .#default
      test-command: nix flake check
  main:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: alexcatdad/ci-actions/.github/workflows/validate-main.yml@2ff7a21eaa680d9eba4987e52697a6f2601054ea
    with:
      nix: true
      test-command: nix flake check
      security-command: |
        for m in backend mcp packages/clients/go; do (cd "$m" && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...); done
        nix build .#default -o result && { nix run --inputs-from . nixpkgs#vulnix -- result || test $? -eq 2; }
  codeql:
    permissions:
      contents: read
      security-events: write
    uses: alexcatdad/ci-actions/.github/workflows/codeql.yml@2ff7a21eaa680d9eba4987e52697a6f2601054ea
    with:
      languages: '["actions", "go", "javascript-typescript"]'
  deploy:
    needs: main
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions: {}
    uses: alexcatdad/ci-actions/.github/workflows/slot-deploy.yml@2ff7a21eaa680d9eba4987e52697a6f2601054ea
    with:
      slot: scratchpad
