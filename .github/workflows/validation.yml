# Validation through the shared contract (alexcatdad/ci-actions, pinned).
# After a push to main (or a manual run) passes the main jobs, the deploy job
# runs homelab-deploy-slot on this repo's own runner on the homelab: the host
# builds the tip of main from GitHub, switches the slot, checks health and
# rolls back on failure. The weekly schedule never deploys.
# The vulnix report (security) lists known CVEs in the built package and never
# fails the job (findings, or its NVD download timing out).
# govulncheck covers the Go modules with packages (tools/lint only pins tools).
name: Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: alexcatdad/ci-actions/.github/workflows/validate-pr.yml@76e8ddb7079aa16605a84138f9357143adcc878d
    with:
      nix: true
      build-command: nix build .#default
      test-command: nix flake check
      # Paths no build or check reads. Markdown and docs/openapi.json stay out:
      # nix flake check lints them (prettier, markdownlint, biome).
      inert-paths: LICENSE
  main:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: alexcatdad/ci-actions/.github/workflows/validate-main.yml@76e8ddb7079aa16605a84138f9357143adcc878d
    with:
      nix: true
      test-command: nix flake check
      security-command: |
        for m in backend mcp packages/clients/go; do (cd "$m" && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...); done
        nix build .#default -o result && { nix run --inputs-from . nixpkgs#vulnix -- result || echo "vulnix exited $? (2 = findings; report only)"; }
  codeql:
    permissions:
      contents: read
      security-events: write
    uses: alexcatdad/ci-actions/.github/workflows/codeql.yml@76e8ddb7079aa16605a84138f9357143adcc878d
    with:
      languages: '["actions", "go", "javascript-typescript"]'
  deploy:
    needs: main
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions: {}
    uses: alexcatdad/ci-actions/.github/workflows/slot-deploy.yml@76e8ddb7079aa16605a84138f9357143adcc878d
    with:
      slot: scratchpad
