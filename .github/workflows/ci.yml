name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - name: Verify generated API clients and actual authenticated calls
        run: |
          npm run sdk:check
          npm run sdk:build
          npm run sdk:test
          cd packages/clients/go
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/scratchpad-mcp
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: scratchpad
          POSTGRES_PASSWORD: scratchpad-test
          POSTGRES_DB: scratchpad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scratchpad -d scratchpad_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_POSTGRES_URL: postgres://scratchpad:scratchpad-test@localhost:5432/scratchpad_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test -w @scratchpad/web
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @scratchpad/web
      - name: Verify authenticated PostgreSQL browser and stdio MCP persistence
        run: npx playwright test tests/workflow.spec.ts tests/github-workflow.spec.ts
        env:
          SCRATCHPAD_E2E_DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}
      - name: Verify PostgreSQL AI workflow and consent boundaries
        run: npx playwright test tests/post-mvp.spec.ts
        env:
          SCRATCHPAD_E2E_POSTGRES: "1"
  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: scratchpad-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_PGVECTOR_URL: postgres://postgres:scratchpad-test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify native vector ranking, consent, rebuild and readiness
        run: npm run test -w @scratchpad/web -- src/server/pgvector.test.ts
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - name: Install pinned infrastructure linters
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          curl --fail --silent --show-error --location https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz --output "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: bash scripts/lint-infrastructure.sh
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config --quiet
      - run: docker build -t scratchpad:ci .
      - run: bash scripts/docker-smoke.sh scratchpad:ci
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify browser and MCP against container backup restore
        run: npm run test:e2e
        env:
          SCRATCHPAD_E2E_DOCKER: "1"
