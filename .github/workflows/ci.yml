name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - name: Build an isolated local-service fixture for the Swift IPC smoke
        run: go build -C mcp -o "$RUNNER_TEMP/scratchpad-service-smoke" ./cmd/scratchpad-service
      - name: Verify native package, Swift IPC seam and synthetic gates
        env:
          SCRATCHPAD_TEST_SERVICE: ${{ runner.temp }}/scratchpad-service-smoke
        run: swift test --package-path macos
      - name: Verify app metadata, release validator and shell scripts
        run: |
          plutil -lint macos/Resources/Info.plist macos/Resources/KeychainHelper-Info.plist macos/Resources/com.alexcatdad.scratchpad.service.plist
          for script in macos/Scripts/*.sh; do sh -n "$script"; done
          macos/Scripts/test-release-validator.sh
          macos/Scripts/test-bundle-validator.sh
          macos/Scripts/test-package-app.sh
  web-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - name: Verify generated API clients and actual authenticated calls
        run: |
          npm run sdk:check
          npm run sdk:build
          npm run sdk:test
          cd packages/clients/go
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Build Go browser and MCP fixtures before acceptance timeouts
        run: |
          go -C backend build -o "$RUNNER_TEMP/scratchpad-e2e-server" ./cmd/scratchpad-server
          go -C mcp build -o "$RUNNER_TEMP/scratchpad-e2e-mcp" ./cmd/scratchpad-mcp
      - run: npm run test:e2e -- --project=retained
        env:
          SCRATCHPAD_E2E_SERVER_BINARY: ${{ runner.temp }}/scratchpad-e2e-server
          SCRATCHPAD_E2E_MCP_BINARY: ${{ runner.temp }}/scratchpad-e2e-mcp
      - name: Retain concurrent-agent workload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: concurrent-agents-sqlite
          path: test-results/**/concurrent-agent-baseline.json
          if-no-files-found: ignore
  go:
    # Keep the existing required check and fail closed if any Go lane is skipped,
    # cancelled or unsuccessful. No branch-protection migration is needed.
    if: ${{ always() }}
    needs: [go-mcp, go-backend, go-browser, go-container]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Go lane to succeed
        env:
          MCP: ${{ needs.go-mcp.result }}
          BACKEND: ${{ needs.go-backend.result }}
          BROWSER: ${{ needs.go-browser.result }}
          CONTAINER: ${{ needs.go-container.result }}
        run: |
          test "$MCP" = success
          test "$BACKEND" = success
          test "$BROWSER" = success
          test "$CONTAINER" = success
  go-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/scratchpad-mcp
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  go-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: scratchpad
          POSTGRES_PASSWORD: scratchpad-test
          POSTGRES_DB: scratchpad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scratchpad -d scratchpad_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_POSTGRES_URL: postgres://scratchpad:scratchpad-test@localhost:5432/scratchpad_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the pinned TypeScript rollback source
        run: |
          revision=0990411697f9eda7c535acf0d2f0697d7ae6f149
          if ! git cat-file -e "$revision^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$revision"
          fi
          test "$(git rev-parse "$revision^{commit}")" = "$revision"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            mcp/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build -o "$RUNNER_TEMP/scratchpad-server" ./cmd/scratchpad-server
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Typecheck the retained API rollback fixture
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable --strict --esModuleInterop --skipLibCheck tests/typescript-api-fixture.ts
        working-directory: .
      - name: Typecheck the actual generated SDK consumer fixture
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable --strict --esModuleInterop --skipLibCheck --allowImportingTsExtensions packages/clients/test.ts
        working-directory: .
      - name: Verify Go backend, PostgreSQL restore and retained-runtime rollback
        shell: bash
        run: bash ../scripts/backend-shard.sh "$SHARD" | tee "$RUNNER_TEMP/go-backend-tests.jsonl"
        env:
          SHARD: ${{ matrix.shard }}
          # Fixtures await shutdown; remove only the race runtime's exit sleep.
          GORACE: atexit_sleep_ms=0
          TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
      - name: Retain backend test timings and outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-backend-tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-backend-tests.jsonl
          if-no-files-found: error
  go-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: scratchpad
          POSTGRES_PASSWORD: scratchpad-test
          POSTGRES_DB: scratchpad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scratchpad -d scratchpad_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_POSTGRES_URL: postgres://scratchpad:scratchpad-test@localhost:5432/scratchpad_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            mcp/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Typecheck the Go authentication browser seams
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM --strict --esModuleInterop --skipLibCheck tests/go-passkeys.spec.ts tests/go-github.spec.ts tests/go-dashboard.spec.ts tests/go-runtime.spec.ts tests/go-container.spec.ts
      - name: Verify Go passkeys, GitHub OAuth and retained dashboard
        run: |
          npm run build -w @scratchpad/web
          npx playwright test --project=go-native
        env:
          TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
  go-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build default Go image and historical TypeScript rollback image
        run: |
          docker --context default build -t scratchpad-go:ci .
          TEST_DOCKER_CONTEXT=default bash scripts/build-rollback-fixture.sh scratchpad-retained:ci
      - name: Verify Go image browser access and operational restore
        run: npx playwright test --project=go-container
        env:
          TEST_DOCKER_CONTEXT: default
          TEST_GO_IMAGE: scratchpad-go:ci
          TEST_RETAINED_IMAGE: scratchpad-retained:ci
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: scratchpad
          POSTGRES_PASSWORD: scratchpad-test
          POSTGRES_DB: scratchpad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scratchpad -d scratchpad_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_POSTGRES_URL: postgres://scratchpad:scratchpad-test@localhost:5432/scratchpad_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test -w @scratchpad/web
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @scratchpad/web
      - name: Build Go browser and MCP fixtures before acceptance timeouts
        run: |
          go -C backend build -o "$RUNNER_TEMP/scratchpad-e2e-server" ./cmd/scratchpad-server
          go -C mcp build -o "$RUNNER_TEMP/scratchpad-e2e-mcp" ./cmd/scratchpad-mcp
      - name: Verify authenticated PostgreSQL browser and stdio MCP persistence
        run: npx playwright test tests/workflow.spec.ts tests/github-workflow.spec.ts tests/workflow-harness.spec.ts tests/concurrent-agents.spec.ts
        env:
          SCRATCHPAD_E2E_DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}
          SCRATCHPAD_E2E_SERVER_BINARY: ${{ runner.temp }}/scratchpad-e2e-server
          SCRATCHPAD_E2E_MCP_BINARY: ${{ runner.temp }}/scratchpad-e2e-mcp
      - name: Retain concurrent-agent PostgreSQL measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: concurrent-agents-postgres
          path: test-results/**/concurrent-agent-baseline.json
          if-no-files-found: ignore
      - name: Verify PostgreSQL AI workflow and consent boundaries
        run: npx playwright test tests/post-mvp.spec.ts
        env:
          SCRATCHPAD_E2E_POSTGRES: "1"
  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: scratchpad-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_PGVECTOR_URL: postgres://postgres:scratchpad-test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            mcp/go.sum
      - name: Verify Go vector ranking, consent, rebuild and readiness
        shell: bash
        run: go -C backend test -json -race -count=1 -run 'RAG|Semantic|Embedding|Passage' ./... | tee "$RUNNER_TEMP/go-pgvector-tests.jsonl"
        env:
          GORACE: atexit_sleep_ms=0
          TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          TEST_POSTGRES_URL: postgres://postgres:scratchpad-test@localhost:5432/postgres
      - name: Retain pgvector test timings and outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-pgvector-tests
          path: ${{ runner.temp }}/go-pgvector-tests.jsonl
          if-no-files-found: ignore
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - name: Install pinned infrastructure linters
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          curl --fail --silent --show-error --location https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz --output "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: bash scripts/lint-infrastructure.sh
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config --quiet
      - run: docker build -t scratchpad:ci .
      - run: bash scripts/docker-smoke.sh scratchpad:ci
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build Go browser and MCP fixtures before acceptance timeouts
        run: |
          go -C backend build -o "$RUNNER_TEMP/scratchpad-e2e-server" ./cmd/scratchpad-server
          go -C mcp build -o "$RUNNER_TEMP/scratchpad-e2e-mcp" ./cmd/scratchpad-mcp
      - name: Verify browser and MCP against container backup restore
        run: npm run test:e2e -- --project=retained
        env:
          SCRATCHPAD_E2E_DOCKER: "1"
          SCRATCHPAD_E2E_SERVER_BINARY: ${{ runner.temp }}/scratchpad-e2e-server
          SCRATCHPAD_E2E_MCP_BINARY: ${{ runner.temp }}/scratchpad-e2e-mcp
      - name: Retain concurrent-agent container measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: concurrent-agents-container
          path: test-results/**/concurrent-agent-baseline.json
          if-no-files-found: ignore
